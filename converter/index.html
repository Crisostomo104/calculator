<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="calculator-container">
        <a href="../" class="back-link">&larr; Back to Hub</a>
        <header>
            <h1>Unit Converter</h1>
            <p>Length & Weight</p>
        </header>

        <div class="card">
            <div class="tabs">
                <button class="tab active" onclick="switchCategory('length')">Length</button>
                <button class="tab" onclick="switchCategory('weight')">Weight</button>
            </div>

            <div class="converter-box">
                <div class="form-group">
                    <input type="number" id="inputValue" placeholder="Enter value" oninput="convert()">
                    <select id="inputUnit" onchange="convert()">
                        <!-- Options generated by JS -->
                    </select>
                </div>
                
                <div class="equals-icon">=</div>
                
                <div class="form-group">
                    <input type="text" id="outputValue" placeholder="Result" readonly>
                    <select id="outputUnit" onchange="convert()">
                        <!-- Options generated by JS -->
                    </select>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
