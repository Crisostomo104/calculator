<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="calculator-container">
        <a href="../" class="back-link">&larr; Back to Hub</a>
        <header>
            <h1>Tip Calculator</h1>
            <p>Split Bills & Calculate Gratuity</p>
        </header>

        <div class="card">
            <div class="form-group">
                <label for="bill">Total Bill Amount ($)</label>
                <input type="number" id="bill" placeholder="e.g. 85.50" oninput="calculateTip()">
            </div>
            
            <div class="form-group">
                <label for="tipPercent">Tip Percentage (%)</label>
                <input type="number" id="tipPercent" value="15" placeholder="e.g. 15" oninput="calculateTip()">
            </div>
            
            <div class="form-group">
                <label for="people">Number of People</label>
                <input type="number" id="people" value="1" min="1" placeholder="e.g. 2" oninput="calculateTip()">
            </div>

            <div class="results" id="results">
                <div class="result-row">
                    <span>Total Tip:</span>
                    <span class="value highlight" id="totalTip">$0.00</span>
                </div>
                <div class="result-row">
                    <span>Total with Tip:</span>
                    <span class="value" id="totalBill">$0.00</span>
                </div>
                <div class="result-row highlight-row">
                    <span>Amount Per Person:</span>
                    <span class="value" id="perPerson">$0.00</span>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
