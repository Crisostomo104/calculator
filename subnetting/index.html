<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Subnet Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <a href="../" class="back-link">&larr; Back to Hub</a>
        <header>
            <h1>Subnet Calculator</h1>
            <p>Design your network architecture</p>
        </header>

        <main>
            <div class="card">
                <h2>1. Base Network</h2>
                <div class="form-group">
                    <label for="ipAddress">IP Address</label>
                    <input type="text" id="ipAddress" placeholder="e.g. 192.168.1.0" oninput="analyzeIP()">
                    <small id="ipFeedback" class="feedback"></small>
                </div>
                
                <div class="results-grid" id="baseNetworkResults">
                    <div class="result-item">
                        <span class="label">Class</span>
                        <span class="value" id="ipClass">-</span>
                    </div>
                    <div class="result-item">
                        <span class="label">Default Mask</span>
                        <span class="value" id="defaultMask">-</span>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>2. Subnetting Requirements</h2>
                <div class="tabs">
                    <button class="tab active" onclick="switchTab('subnets')">By Departments (Subnets)</button>
                    <button class="tab" onclick="switchTab('hosts')">By Users (Hosts)</button>
                </div>
                
                <div class="form-group" id="reqInputGroup">
                    <label id="reqLabel" for="requirement">Number of Departments Needed</label>
                    <input type="number" id="requirement" min="1" placeholder="e.g. 4" oninput="calculateSubnets()">
                </div>
            </div>

            <div class="card results-card" id="calculationResults" style="display: none;">
                <h2>3. Calculation Results</h2>
                
                <div class="summary-box">
                    <div class="summary-item">
                        <span class="label">Borrowed Bits</span>
                        <span class="value highlight" id="borrowedBits">0</span>
                    </div>
                    <div class="summary-item">
                        <span class="label">New Subnet Mask</span>
                        <span class="value highlight" id="newMask">-</span>
                    </div>
                    <div class="summary-item">
                        <span class="label">Usable Hosts per Subnet</span>
                        <span class="value highlight" id="hostsPerSubnet">0</span>
                    </div>
                </div>

                <div class="table-container">
                    <table id="subnetTable">
                        <thead>
                            <tr>
                                <th>Subnet #</th>
                                <th>Network Address</th>
                                <th>Usable IP Range</th>
                                <th>Broadcast Address</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Generated rows go here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
