<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="calculator-container">
        <a href="../" class="back-link">&larr; Back to Hub</a>
        <header>
            <h1>BMI Calculator</h1>
            <p>Body Mass Index Assessment</p>
        </header>

        <div class="card">
            <div class="tabs">
                <button class="tab active" onclick="switchUnit('metric')">Metric (kg, cm)</button>
                <button class="tab" onclick="switchUnit('imperial')">Imperial (lbs, in)</button>
            </div>

            <div class="form-group">
                <label id="weightLabel" for="weight">Weight (kg)</label>
                <input type="number" id="weight" placeholder="e.g. 70" oninput="calculateBMI()">
            </div>
            
            <div class="form-group">
                <label id="heightLabel" for="height">Height (cm)</label>
                <input type="number" id="height" placeholder="e.g. 175" oninput="calculateBMI()">
            </div>

            <div class="results" id="results" style="display: none;">
                <div class="bmi-score" id="bmiScore">0.0</div>
                <div class="bmi-category" id="bmiCategory">-</div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
