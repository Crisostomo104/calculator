<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="calculator-container">
        <a href="../" class="back-link">&larr; Back to Hub</a>
        <header>
            <h1>Date Calculator</h1>
            <p>Calculate Time Between Dates</p>
        </header>

        <div class="card">
            <div class="form-group">
                <label for="startDate">Start Date</label>
                <input type="date" id="startDate" onchange="calculateDateDiff()">
            </div>
            
            <div class="form-group">
                <label for="endDate">End Date</label>
                <input type="date" id="endDate" onchange="calculateDateDiff()">
            </div>

            <div class="results" id="results" style="display: none;">
                <div class="result-box">
                    <span class="value" id="daysDiff">0</span>
                    <span class="label">Total Days</span>
                </div>
                <div class="breakdown">
                    <div class="bd-item">
                        <span id="weeksDiff">0</span> Weeks
                    </div>
                    <div class="bd-item">
                        <span id="monthsDiff">0</span> Months
                    </div>
                    <div class="bd-item">
                        <span id="yearsDiff">0</span> Years
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
