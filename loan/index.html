<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="calculator-container">
        <a href="../" class="back-link">&larr; Back to Hub</a>
        <header>
            <h1>Loan Calculator</h1>
            <p>Mortgage & Auto Payments</p>
        </header>

        <div class="card">
            <div class="form-group">
                <label for="principal">Loan Amount ($)</label>
                <input type="number" id="principal" placeholder="e.g. 250000" oninput="calculateLoan()">
            </div>
            
            <div class="form-group">
                <label for="interest">Interest Rate (%)</label>
                <input type="number" id="interest" placeholder="e.g. 5.5" step="0.1" oninput="calculateLoan()">
            </div>
            
            <div class="form-group">
                <label for="years">Loan Term (Years)</label>
                <input type="number" id="years" placeholder="e.g. 30" oninput="calculateLoan()">
            </div>

            <div class="results" id="results" style="display: none;">
                <div class="result-row">
                    <span>Monthly Payment:</span>
                    <span class="value highlight" id="monthlyPayment">$0.00</span>
                </div>
                <div class="result-row">
                    <span>Total Interest:</span>
                    <span class="value" id="totalInterest">$0.00</span>
                </div>
                <div class="result-row">
                    <span>Total Payment:</span>
                    <span class="value" id="totalPayment">$0.00</span>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
